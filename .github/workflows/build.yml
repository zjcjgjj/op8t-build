name: Build KernelSU-Next kernel (OnePlus 8T)

on:
  workflow_dispatch:
    inputs:
      ksu_tag:
        description: 'KernelSU-Next tag（4.19 非 GKI 用 v3.4.0-legacy）'
        required: false
        default: 'v3.4.0-legacy'
      jobs:
        description: '并行编译数（留空=自动 nproc）'
        required: false
        default: ''

permissions:
  contents: read

# 同一时间只跑一个，避免重复消耗额度和占用并发
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h / | tail -1

      - name: 加 swap（防 OOM 被杀）
        run: |
          set +e
          cur=$(free -m | awk '/^Swap:/{print $2}')
          echo "现有 swap: ${cur} MB"
          if [ "${cur:-0}" -lt 4096 ]; then
            # 注意：Runner 镜像里 /swapfile 往往已被占用，用独立路径
            sudo rm -f /swap2
            sudo fallocate -l 8G /swap2 2>/dev/null || sudo dd if=/dev/zero of=/swap2 bs=1M count=8192 status=none
            sudo chmod 600 /swap2
            sudo mkswap /swap2 >/dev/null 2>&1
            sudo swapon /swap2 2>/dev/null || echo "swapon 失败（已有 swap 也能继续）"
          fi
          free -h | head -3
          echo "核数: $(nproc)"

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            git make bc bison flex unzip curl python3 xz-utils ccache \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libssl-dev
          sudo apt-get install -y -qq libtinfo5 || sudo apt-get install -y -qq libncurses5 || true

      - name: 缓存 LLVM 工具链
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kbuild/toolchain
          key: llvm10-tc-v1

      # ccache：失败重跑时复用已编译的 .o，把十几分钟的全量编译压到 1-3 分钟
      - name: 恢复 ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kbuild/.ccache
          key: ccache-op8t-${{ github.run_id }}
          restore-keys: |
            ccache-op8t-

      - name: 编译内核（只出 Image，封装在本地做）
        env:
          KSU_TAG: ${{ inputs.ksu_tag }}
          JOBS: ${{ inputs.jobs }}
          WORK: ${{ runner.temp }}/kbuild
        run: |
          set -o pipefail   # 否则脚本失败会被 tee 的退出码掩盖
          chmod +x build_kernel.sh
          date +%s > .start
          ./build_kernel.sh 2>&1 | tee build.log
          echo "耗时: $(( $(date +%s) - $(cat .start) )) 秒"

      - name: 保存 ccache（失败也保存，供下次重跑复用）
        if: always()
        run: mkdir -p "${{ runner.temp }}/kbuild/.ccache"

      - name: 写入 ccache 缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kbuild/.ccache
          key: ccache-op8t-${{ github.run_id }}

      - name: 汇总产物
        if: always()
        run: |
          echo "===== 产物 ====="
          ls -lh kernel_Image 2>/dev/null || true
          grep -a -o "Linux version 4\.19\.[0-9]*-perf[^\" ]\{0,40\}" kernel_Image 2>/dev/null | head -2 || true
          echo "===== 错误摘要（编译失败时看这里）====="
          grep -a -nE "error:|Error [0-9]|undefined reference|fatal error" build.log 2>/dev/null | tail -30 || true

      - name: 上传内核镜像
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image
          path: kernel_Image
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: 上传构建日志（失败排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
