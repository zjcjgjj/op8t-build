name: Build KernelSU-Next kernel (OnePlus 8T)

on:
  workflow_dispatch:
    inputs:
      ksu_tag:
        description: 'KernelSU-Next tag（4.19 非 GKI 用 v3.4.0-legacy）'
        required: false
        default: 'v3.4.0-legacy'
      jobs:
        description: '并行编译数（留空=自动 nproc）'
        required: false
        default: ''

permissions:
  contents: read

# 同一时间只跑一个，避免重复消耗额度和占用并发
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h / | tail -1

      - name: 加 8G swap（防 OOM 被杀）
        run: |
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=none
          sudo chmod 600 /swapfile && sudo mkswap -q /swapfile && sudo swapon /swapfile
          free -h | head -3
          echo "核数: $(nproc)"

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            git make bc bison flex unzip curl python3 xz-utils \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libssl-dev
          sudo apt-get install -y -qq libtinfo5 || sudo apt-get install -y -qq libncurses5 || true

      - name: 缓存 LLVM 工具链
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kbuild/toolchain
          key: llvm10-tc-v1

      - name: 编译内核（只出 Image，封装在本地做）
        env:
          KSU_TAG: ${{ inputs.ksu_tag }}
          JOBS: ${{ inputs.jobs }}
          WORK: ${{ runner.temp }}/kbuild
        run: |
          set -o pipefail   # 否则脚本失败会被 tee 的退出码掩盖
          chmod +x build_kernel.sh
          date +%s > .start
          ./build_kernel.sh 2>&1 | tee build.log
          echo "耗时: $(( $(date +%s) - $(cat .start) )) 秒"

      - name: 汇总产物
        if: always()
        run: |
          echo "===== 产物 ====="
          ls -lh kernel_Image 2>/dev/null || true
          grep -a -o "Linux version 4\.19\.[0-9]*-perf[^\" ]\{0,40\}" kernel_Image 2>/dev/null | head -2 || true
          echo "===== 错误摘要（编译失败时看这里）====="
          grep -a -nE "error:|Error [0-9]|undefined reference|fatal error" build.log 2>/dev/null | tail -30 || true

      - name: 上传内核镜像
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image
          path: kernel_Image
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: 上传构建日志（失败排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
