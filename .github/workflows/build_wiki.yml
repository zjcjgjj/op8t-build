name: Build KSU-Next per official wiki (base / syscall / manual)

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: 'KernelSU-Next ref（官方 wiki = legacy 分支）'
        required: false
        default: 'legacy'
      jobs:
        description: '并行编译数（留空=自动 nproc）'
        required: false
        default: ''
      only_phase:
        description: '留空/all=三阶段全跑；base|syscall|manual=只跑该阶段（修补丁后快速重编）'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: wiki-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h / | tail -1

      - name: 加 swap（防 OOM 被杀）
        run: |
          set +e
          cur=$(free -m | awk '/^Swap:/{print $2}')
          if [ "${cur:-0}" -lt 4096 ]; then
            sudo rm -f /swap2
            sudo fallocate -l 8G /swap2 2>/dev/null || sudo dd if=/dev/zero of=/swap2 bs=1M count=8192 status=none
            sudo chmod 600 /swap2
            sudo mkswap /swap2 >/dev/null 2>&1
            sudo swapon /swap2 2>/dev/null || true
          fi
          free -h | head -3
          echo "核数: $(nproc)"

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            git make bc bison flex unzip curl python3 xz-utils ccache \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libssl-dev
          sudo apt-get install -y -qq libtinfo5 || sudo apt-get install -y -qq libncurses5 || true

      - name: 缓存 LLVM 工具链
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kbuild/toolchain
          key: llvm10-tc-v1

      - name: 恢复 ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kbuild/.ccache
          key: ccache-op8t-${{ github.run_id }}
          restore-keys: |
            ccache-op8t-

      - name: 初始化产物目录
        run: |
          mkdir -p wiki_out
          chmod +x build_wiki.sh
          git log -1 --format='repo HEAD %H %ci' | tee wiki_out/repo_info.txt

      # 顺序固定：base 必须先跑（源码未被官方 Kbuild 的自动 backport 污染）
      # syscall 其次，manual 最后（会打五处源码补丁 + 摘掉 syscall 强制块）
      - name: 阶段 1/3 空白对照内核（官方 wiki 第一条前提）
        if: ${{ inputs.only_phase == '' || inputs.only_phase == 'all' || inputs.only_phase == 'base' }}
        continue-on-error: true
        env:
          PHASE: base
          USE_STOCK_CONFIG: '1'
          KSU_REF: ${{ inputs.ksu_ref }}
          JOBS: ${{ inputs.jobs }}
          WORK: ${{ runner.temp }}/kbuild
          CRC_STAT_FILE: ${{ github.workspace }}/wiki_out/crc_base.txt
        run: |
          set -o pipefail
          rm -f "$CRC_STAT_FILE"
          date +%s > .t1
          ./build_wiki.sh 2>&1 | tee wiki_out/build_base.log
          echo "耗时: $(( $(date +%s) - $(cat .t1) )) 秒" | tee -a wiki_out/build_base.log
          cp kernel_wiki_base wiki_out/ 2>/dev/null || true

      - name: 阶段 2/3 KSU-Next + syscall table hook（Kconfig 指定 4.17+ non-GKI）
        if: ${{ inputs.only_phase == '' || inputs.only_phase == 'all' || inputs.only_phase == 'syscall' }}
        continue-on-error: true
        env:
          PHASE: syscall
          USE_STOCK_CONFIG: '1'
          KSU_REF: ${{ inputs.ksu_ref }}
          JOBS: ${{ inputs.jobs }}
          WORK: ${{ runner.temp }}/kbuild
          CRC_STAT_FILE: ${{ github.workspace }}/wiki_out/crc_syscall.txt
        run: |
          set -o pipefail
          rm -f "$CRC_STAT_FILE"
          date +%s > .t2
          ./build_wiki.sh 2>&1 | tee wiki_out/build_syscall.log
          echo "耗时: $(( $(date +%s) - $(cat .t2) )) 秒" | tee -a wiki_out/build_syscall.log
          cp kernel_wiki_syscall wiki_out/ 2>/dev/null || true

      - name: 阶段 3/3 KSU-Next + 官方 wiki manual hook（五处源码补丁）
        if: ${{ inputs.only_phase == '' || inputs.only_phase == 'all' || inputs.only_phase == 'manual' }}
        continue-on-error: true
        env:
          PHASE: manual
          USE_STOCK_CONFIG: '1'
          KSU_REF: ${{ inputs.ksu_ref }}
          JOBS: ${{ inputs.jobs }}
          WORK: ${{ runner.temp }}/kbuild
          CRC_STAT_FILE: ${{ github.workspace }}/wiki_out/crc_manual.txt
        run: |
          set -o pipefail
          rm -f "$CRC_STAT_FILE"
          date +%s > .t3
          ./build_wiki.sh 2>&1 | tee wiki_out/build_manual.log
          echo "耗时: $(( $(date +%s) - $(cat .t3) )) 秒" | tee -a wiki_out/build_manual.log
          cp kernel_wiki_manual wiki_out/ 2>/dev/null || true

      - name: 汇总三阶段结果与 CRC 漂移
        if: always()
        run: |
          echo "===== 产物 ====="
          ls -lh wiki_out/kernel_wiki_* 2>/dev/null || true
          for p in base syscall manual; do
            f="wiki_out/kernel_wiki_$p"
            if [ -f "$f" ]; then
              echo "  [$p] $(md5sum "$f")"
              grep -a -o "Linux version 4\.19\.[0-9]*-perf[^\" ]\{0,40\}" "$f" | head -1 || true
            else
              echo "  [$p] 未产出"
            fi
          done
          echo "===== CRC 漂移（genksyms 原值 != 原厂值）====="
          for p in base syscall manual; do
            f="wiki_out/crc_$p.txt"
            if [ -f "$f" ]; then
              echo "  [$p] $(sort -u "$f" | wc -l) 个符号漂移"
            else
              echo "  [$p] 无统计文件"
            fi
          done
          echo "===== 各阶段错误摘要 ====="
          for p in base syscall manual; do
            echo "--- $p ---"
            grep -a -nE "error:|Error [0-9]|undefined reference|fatal error|\[FAIL\]" \
              "wiki_out/build_$p.log" 2>/dev/null | tail -12 || true
          done

      - name: 写入 ccache 缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kbuild/.ccache
          key: ccache-op8t-${{ github.run_id }}

      - name: 上传三阶段内核与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-kernels
          path: wiki_out/
          if-no-files-found: warn
          compression-level: 3
          retention-days: 7
